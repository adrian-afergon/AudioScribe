[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audioscribe-local"
version = "0.3.0"
description = "Transcripción local de carpetas con cola SQLite y separación de hablantes"
requires-python = ">=3.11,<3.14"
dependencies = ["watchdog>=6,<7"]

[project.optional-dependencies]
engine = ["faster-whisper>=1.2,<2", "pyannote.audio>=4,<5", "huggingface-hub>=0.34,<2", "psutil>=6,<8"]
test = ["pytest>=8,<10", "numpy>=2,<3"]

[project.scripts]
audioscribe = "audioscribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
